[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopo"
version = "0.1.0"
description = "Purchase-order PDF ingestion pipeline with customer-specific parsers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
autopo = "autopo.cli:main"
autopo-gui = "autopo.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["autopo"]
# Tkinter front-end: nothing to assert without a display server.
omit = ["*/autopo/gui.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
