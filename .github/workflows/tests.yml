name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10"; prove it.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

      - name: Smoke-test the README walkthrough
        run: |
          python samples/generate_mock_pos.py --out samples/generated
          python -m autopo.cli ingest samples/generated/ --workbook out/open_order.xlsx
